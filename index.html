<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventi Roma</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 6px; }
th { background-color: #f2f2f2; }
.tipo-col { text-align: center; }

.recensione-btn {
  cursor: pointer;
  color: blue;
  text-decoration: underline;
}

.allineamento-link {
    cursor: pointer;
    color: blue;
    text-decoration: underline;
}

.eroma-link {
    cursor: pointer;
    color: #0066cc;
    text-decoration: underline;
    font-weight: bold;
    font-size: 18px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 20px;
}

.eroma-link:hover {
    color: #004499;
}

td[data-label="NO"] {
    text-align: center;
}

.no-checkbox {
    cursor: pointer;
    width: 18px;
    height: 18px;
    vertical-align: middle;
}

#popupOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 900;
}
#popupRecensione {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    max-width: 900px;
    max-height: 75%;
    background: #fff;
    border: 2px solid #444;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 1000;
    padding: 15px;
    overflow: auto;
}

/* Responsive CSS */
@media screen and (max-width: 600px) {
  table, thead, tbody, th, td, tr { 
    display: block; 
  }
  
  thead tr { 
    position: absolute;
    top: -9999px;
    left: -9999px;
  }
  
  tr { border: 1px solid #ccc; margin-bottom: 10px; }
  
  td { 
    border: none;
    border-bottom: 1px solid #eee; 
    position: relative;
    padding-left: 35%; 
    white-space: normal;
    text-align: left;
  }
  
  td:before { 
    position: absolute;
    top: 6px;
    left: 6px;
    width: 30%; 
    padding-right: 10px; 
    white-space: nowrap;
    text-align: left;
    font-weight: bold;
    content: attr(data-label);
  }

  .eroma-link {
      font-size: 18px;
      display: inline-block;
      margin-right: 0 !important;
      margin-bottom: 5px;
  }

  div[style*="margin-bottom:15px;"] {
      display: flex;
      flex-direction: column;
      gap: 10px;
  }
  
  div[style*="margin-bottom:15px;"] label {
      margin-left: 0 !important;
      display: flex;
      justify-content: space-between;
      align-items: center;
  }

  td[data-label="Idn"] { display: none; }
  td[data-label="Costo"]:empty { display: none; }
  td[data-label="NO"] { text-align: left; }
  .desktop-only { display: none !important; }
}
</style>
</head>
<body>

<div style="margin-bottom:15px;">
  <a href="eroma.html" class="eroma-link">guida</a>

  <label>Tipo:
    <select id="filterTipo">
      <option value="tutti">Tutti</option>
      <option value="spettacoli">Spettacoli</option>
      <option value="mostre">Mostre</option>
      <option value="concerti">Concerti</option>
      <option value="cinema">Cinema</option>
      <option value="festival">Festival</option>
    </select>
  </label>

  <label style="margin-left:15px;">Allineamento >
    <input type="number" id="filterAllineamento" value="0" step="any" style="width:60px;">
  </label>

  <label style="margin-left:15px;">Qualità >
    <input type="number" id="filterQualita" value="0" min="0" style="width:60px;">
  </label>

  <label style="margin-left:15px;">Da:
    <input type="date" id="filterDataInizio">
  </label>

  <!-- Mod 1: Replaced date fine field with numerical "Giorni" field -->
  <label style="margin-left:10px;">Giorni:
    <input type="number" id="filterGiorni" value="7" min="1" style="width:60px;">
  </label>

  <label style="margin-left:15px;">Cerca:
    <input type="text" id="filterCerca" placeholder="Cerca in tutti i campi..." style="width:140px;">
  </label>

  <label style="margin-left:15px;">NO:
    <input type="checkbox" id="filterNo" style="cursor: pointer; width: 18px; height: 18px; vertical-align: middle;">
  </label>
</div>

<noscript><style>#loadingAllineamento { display: none !important; } #eventiTable { display: table !important; }</style></noscript>

<div id="loadingAllineamento" style="text-align: center; padding: 30px; font-size: 18px; font-weight: 600; color: #334155;">
  calcolo valori di allineamento in corso
</div>

<table id="eventiTable" style="display: none;">
<thead>
<tr>
  <th>Idn</th>
  <th>Data</th>
  <th>Tipo</th>
  <th>Titolo, Artisti</th>
  <th>Luogo</th>
  <th>Costo</th>
  <th style="width: 50px;">Allineamento</th>
  <th>Qualità</th>
  <th style="width: 40px; text-align: center;">NO</th>
</tr>
</thead>
<tbody>

</tbody>
</table>

<div id="popupOverlay"></div>
<div id="popupRecensione">
  <h2>Dettaglio</h2>
  <div id="contenutoRecensione"></div>
  <button onclick="chiudiPopup()" style="margin-top:15px;">OK</button>
</div>

<script>
const EVENT_ALIGNMENTS = [];

function getNoshowList() {
    try {
        const raw = localStorage.getItem('NOSHOW');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.map(String) : [];
    } catch (e) {
        return [];
    }
}

function setNoshowList(list) {
    try {
        localStorage.setItem('NOSHOW', JSON.stringify(list));
    } catch (e) {
        console.error("Errore salvataggio NOSHOW in localStorage:", e);
    }
}

function toggleNoshow(idn, isChecked) {
    let list = getNoshowList();
    const strIdn = String(idn);
    if (isChecked) {
        if (!list.includes(strIdn)) {
            list.push(strIdn);
        }
    } else {
        list = list.filter(id => id !== strIdn);
    }
    setNoshowList(list);
    filtraEventi();
}

function leggiPreferenzeUtente() {
    const TIPI = ['cinema', 'spettacoli', 'concerti', 'mostre', 'festival'];
    const prefs = {};
    let hasNonZero = false;

    for (let i = 0; i < TIPI.length; i++) {
        const t = TIPI[i];
        let arr = [];
        try {
            const raw = localStorage.getItem(t);
            if (raw) arr = JSON.parse(raw);
        } catch (e) {}
        if (!Array.isArray(arr)) arr = [];
        
        const f32 = new Float32Array(arr.length);
        for (let j = 0; j < arr.length; j++) {
            const val = typeof arr[j] === 'number' ? arr[j] : (parseFloat(arr[j]) || 0);
            f32[j] = val;
            if (val !== 0) {
                hasNonZero = true;
            }
        }
        prefs[t] = f32;
    }
    return { prefs, hasNonZero };
}

function calcolaAllineamenti() {
    const { prefs, hasNonZero } = leggiPreferenzeUtente();
    const rows = document.querySelectorAll('tbody tr');
    const spans = document.querySelectorAll('tbody tr .allineamento-link');
    const total = Math.min(EVENT_ALIGNMENTS.length, rows.length);

    if (!hasNonZero) {
        for (let i = 0; i < total; i++) {
            if (spans[i]) spans[i].textContent = "0";
            if (rows[i]) rows[i].dataset.allineamento = "0";
        }
        return;
    }

    for (let i = 0; i < total; i++) {
        const ev = EVENT_ALIGNMENTS[i];
        const tipo = (ev.tipo || "").toLowerCase().trim();
        const pref = prefs[tipo];
        let score = 0;
        if (pref && ev.v && ev.v.length > 0 && pref.length > 0) {
            const v = ev.v;
            const len = Math.min(v.length, pref.length);
            let sum = 0;
            for (let k = 0; k < len; k++) {
                sum += v[k] * pref[k];
            }
            score = Math.round(sum * 100) / 100;
        }
        const scoreStr = String(score);
        if (spans[i]) spans[i].textContent = scoreStr;
        if (rows[i]) rows[i].dataset.allineamento = scoreStr;
    }
}

function eseguiCalcoloEVisualizza() {
    calcolaAllineamenti();
    const loadingEl = document.getElementById('loadingAllineamento');
    if (loadingEl) loadingEl.style.display = 'none';
    const tableEl = document.getElementById('eventiTable');
    if (tableEl) tableEl.style.display = '';
    filtraEventi();
}

function filtraEventi() {
    const tipo = document.getElementById('filterTipo').value.toLowerCase();
    const allMinVal = document.getElementById('filterAllineamento').value;
    const allMin = allMinVal !== "" ? parseFloat(allMinVal) : -999;
    const qualMin = parseFloat(document.getElementById('filterQualita').value) || 0;
    const filterNo = document.getElementById('filterNo').checked;
    const dInizio = document.getElementById('filterDataInizio').value;
    const giorni = parseInt(document.getElementById('filterGiorni').value) || 7;
    const cerca = (document.getElementById('filterCerca').value || "").toLowerCase().trim();
    
    // Mod 1: Calculate dFine dynamically based on Da + (Giorni - 1)
    let dFine = "";
    if (dInizio) {
        const parts = dInizio.split('-');
        if (parts.length === 3) {
            const startD = new Date(parts[0], parts[1] - 1, parts[2]);
            startD.setDate(startD.getDate() + (giorni - 1));
            const yyyy = startD.getFullYear();
            const mm = String(startD.getMonth() + 1).padStart(2, '0');
            const dd = String(startD.getDate()).padStart(2, '0');
            dFine = `${yyyy}-${mm}-${dd}`;
        }
    }

    const noshowSet = new Set(getNoshowList());

    document.querySelectorAll('tbody tr').forEach(tr => {
        let show = true;
        
        const idn = tr.dataset.idn;
        const isNoshow = noshowSet.has(idn);
        
        const cb = tr.querySelector('.no-checkbox');
        if (cb) {
            cb.checked = isNoshow;
        }

        const tdTipo = tr.cells[2].textContent.toLowerCase();
        const tdAll = parseFloat(tr.cells[6].textContent) || 0;
        const tdQual = parseFloat(tr.cells[7].textContent) || 0;
        
        const evInizio = tr.dataset.inizio;
        const evFine = tr.dataset.fine;
        const evCerca = (tr.dataset.cerca || tr.textContent).toLowerCase();

        if (filterNo) {
            // Visualizza solo gli eventi contenuti nella lista NOSHOW
            if (!isNoshow) show = false;
            if (tipo !== 'tutti' && tdTipo !== tipo) show = false;
            if (cerca && !evCerca.includes(cerca)) show = false;
        } else {
            // Non visualizzare gli eventi contenuti nella lista NOSHOW
            if (isNoshow) show = false;
            if (tipo !== 'tutti' && tdTipo !== tipo) show = false;
            if (!isNaN(allMin) && tdAll < allMin) show = false;
            if (tdQual < qualMin) show = false;
            if (dInizio && evFine < dInizio) show = false;
            if (dFine && evInizio > dFine) show = false;
            if (cerca && !evCerca.includes(cerca)) show = false;
        }

        tr.style.display = show ? '' : 'none';
    });
}

document.querySelectorAll(
  '#filterTipo, #filterAllineamento, #filterQualita, #filterNo, #filterDataInizio, #filterGiorni, #filterCerca'
).forEach(el => {
    el.addEventListener('input', filtraEventi);
    el.addEventListener('change', filtraEventi);
});

document.querySelector('tbody').addEventListener('change', (e) => {
    if (e.target && e.target.classList.contains('no-checkbox')) {
        const idn = e.target.dataset.idn;
        toggleNoshow(idn, e.target.checked);
    }
});

function mostraPopup(testo) {
    if (!testo) testo = "Nessun contenuto disponibile.";
    document.getElementById('contenutoRecensione').innerHTML =
        testo.replace(/\n/g,'<br>');
    document.getElementById('popupRecensione').style.display = 'block';
    document.getElementById('popupOverlay').style.display = 'block';
}
function chiudiPopup() {
    document.getElementById('popupRecensione').style.display = 'none';
    document.getElementById('popupOverlay').style.display = 'none';
}

window.addEventListener('DOMContentLoaded', (event) => {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const todayISO = `${yyyy}-${mm}-${dd}`;
    
    const dateInput = document.getElementById('filterDataInizio');
    if (dateInput) {
        dateInput.value = todayISO;
    }

    requestAnimationFrame(() => {
        setTimeout(eseguiCalcoloEVisualizza, 10);
    });
});

window.addEventListener('pageshow', (event) => {
    calcolaAllineamenti();
    filtraEventi();
});

window.addEventListener('storage', (event) => {
    if (['cinema', 'spettacoli', 'concerti', 'mostre', 'festival'].includes(event.key)) {
        calcolaAllineamenti();
        filtraEventi();
    }
});
</script>

</body>
</html>
